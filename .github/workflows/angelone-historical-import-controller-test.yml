
name: BADAL SEVERIYA - Angel One Historical Import Controller Test

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "angelone-converter.js"
      - "angelone-converter.test.js"
      - "angelone-historical-import-controller.js"
      - "angelone-historical-import-controller.test.js"
      - "historical-candle-merge.js"
      - "historical-candle-batch-import.js"
      - "historical-candle-batch-import.test.js"
      - ".github/workflows/angelone-historical-import-controller-test.yml"

jobs:
  angelone-historical-import-controller-test:
    name: Run Angel One Historical Import Controller Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Angel One Historical Import Controller Tests
        run: node angelone-historical-import-controller.test.js
