
name: Historical Candle Merge Test

on:
  push:
    branches:
      - main
    paths:
      - "historical-candle-merge.js"
      - "historical-candle-merge.test.js"
      - "historical-candle-batch-import.js"
      - "historical-candle-batch-import.test.js"
      - "historical-data-import.js"
      - "historical-data-import-controller.js"
      - "historical-data-import-controller.test.js"
      - "package.json"
      - ".github/workflows/candle-merge-test.yml"

  workflow_dispatch:

jobs:
  candle-merge-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Historical Candle Merge Tests
        run: npm run test:candle-merge

      - name: Run Historical Candle Batch Import Tests
        run: npm run test:candle-batch-import

      - name: Run Historical Data Import Controller Tests
        run: npm run test:import-controller
