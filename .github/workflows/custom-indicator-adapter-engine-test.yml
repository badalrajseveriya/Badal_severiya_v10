name: Custom Indicator Adapter Engine Tests

on:
  push:
    branches:
      - main
    paths:
      - custom-indicator-adapter-engine.js
      - custom-indicator-adapter-engine.test.js
      - .github/workflows/custom-indicator-adapter-engine-test.yml

  pull_request:
    branches:
      - main
    paths:
      - custom-indicator-adapter-engine.js
      - custom-indicator-adapter-engine.test.js
      - .github/workflows/custom-indicator-adapter-engine-test.yml

  workflow_dispatch:

permissions:
  contents: read

jobs:
  custom-indicator-adapter-engine-tests:
    name: Run 67 Adapter Engine Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify engine file
        run: test -f custom-indicator-adapter-engine.js

      - name: Verify test file
        run: test -f custom-indicator-adapter-engine.test.js

      - name: Syntax check engine
        run: node --check custom-indicator-adapter-engine.js

      - name: Syntax check test file
        run: node --check custom-indicator-adapter-engine.test.js

      - name: Run adapter engine tests
        run: node custom-indicator-adapter-engine.test.js