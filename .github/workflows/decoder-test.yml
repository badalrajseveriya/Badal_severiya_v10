
name: BADAL SEVERIYA V11 - Code Checks

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check JavaScript Syntax
        run: |
          node --check data-worker.js
          node --check angelone-converter.js
          node --check market-data.js
          node --check websocket-decoder.js

      - name: Run Decoder Tests
        run: npm run test:decoder
