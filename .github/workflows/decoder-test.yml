
name: BADAL SEVERIYA Decoder Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check files
        run: |
          pwd
          ls -la
          ls -la websocket-decoder.test.js

      - name: Run Decoder Tests
        run: npm run test:decoder
