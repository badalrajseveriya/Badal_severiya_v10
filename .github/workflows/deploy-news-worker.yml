name: Deploy News Intelligence Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - news-intelligence-worker.js
      - wrangler-news.toml
      - .github/workflows/deploy-news-worker.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy News Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: deploy --config wrangler-news.toml