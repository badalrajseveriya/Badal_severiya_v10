
name: BADAL SEVERIYA V12 - Intraday Gap Checker Tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "intraday-gap-check.js"
      - "intraday-gap-check.test.js"
      - "intraday-gap-api-runner.js"
      - "intraday-gap-api-runner.test.js"
      - "package.json"
      - ".github/workflows/intraday-gap-api-runner-test.yml"

jobs:
  intraday-gap-check-tests:
    name: Test Intraday Gap Checker and API Runner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Intraday Gap Checker Tests
        run: npm run test:intraday-gap

      - name: Run Intraday Gap API Runner Tests
        run: npm run test:intraday-gap-api-runner
