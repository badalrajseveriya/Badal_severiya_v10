
name: Historical Candle Merge Test

on:
  push:
    branches:
      - main
    paths:
      - "historical-candle-merge.js"
      - "historical-candle-merge.test.js"
      - "package.json"
      - ".github/workflows/candle-merge-test.yml"

  workflow_dispatch:

jobs:
  candle-merge-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Candle Merge Test
        run: npm run test:candle-merge
